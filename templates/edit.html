<style>
		

	

		@property --angle {
		syntax: "<angle>";
		inherits: false;
		initial-value: 0deg;
		}
		@property --angle2 {
		syntax: "<angle>";
		inherits: false;
		initial-value: 0deg;
		}
		@property --hue {
		syntax: "<angle>";
		inherits: false;
		initial-value: 0deg;
		}
		
		.splash{
            z-index: 100;
			height: 100vh;
			width: 100vw;

			position: fixed;
			top:0;
			left:0;
			background-color: var(--bg-primary);

			display: flex;

			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		.circle-gradient {
		
            z-index: 50;
			width: 6rem;          
			height: 6rem;
			border-radius: 50%;    
			background: #eeeeee00;  
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			}

		.circle-gradient::before {
            z-index: 50;
			content: '';
			position: absolute;
			inset: -20px;         
			padding: 1.5rem;          
			border-radius: 50%;            
			background: conic-gradient(
				#00ffcc00 var(--angle2),
				var(--text-primary) 0deg,	
				hsl(var(--hue),100%,20%) var(--angle),
				#00ffcc00 0deg,
				#00ffcc00
		
				
			);
			z-index: -1;
			
			mask: linear-gradient(#ffffff 0 0) content-box, 
					linear-gradient(#fff 0 0);
			mask-composite: exclude;


			animation: rotate 0.9s infinite ease-in-out;
			}

			

			@keyframes rotate {
				0% {
					--angle:0deg;
					--angle2:0deg;

					--hue: 200deg
				}
				50% {
					--angle:360deg;
					--angle2:0deg;
				}
				100% {
					--angle2:360deg;
					--angle:360deg;

					--hue:300deg;
				}
            }
		

</style>

<script defer src="/static/js/page-script.js"></script>

<script>

let is_auth
let authdivs = document.getElementsByName("auth")
let login_btn = document.getElementById("loginbtn")

try{
    is_auth = {{ .IsAuth }}
}
catch (error){
    is_auth = false
}
if (!is_auth){
    for (el of authdivs){
        el.style.display = `none`
    }
    login_btn.href = `/-/login?next=${window.location.href}`
}
else{
    login_btn.firstElementChild.src = "/static/icons/logout.svg"
    login_btn.href = `/-/logout?next=${window.location.pathname}`
}
if (window.location.pathname!="/"){
    let p = decodeURI(window.location.pathname).split("/")
    if (window.location.pathname.includes("/-/")==false&&p.length>0){
        p=p[p.length-1]
    }
    else{
        
        let h = document.getElementById("content").querySelector("h1")
        if (h!==undefined && h!==null){
            p=h.innerText
        }
        else{
            p="Wiki"
        }
    }
    document.title = p
}
else if (window.location.pathname=="/"){
    document.title = {{ .Title }}
}
</script>

<script defer>
    addEventListener("DOMContentLoaded", (event) => { 
        splash = document.getElementsByClassName("splash")

        splash[0].style.display="none"

    })
    
</script>
