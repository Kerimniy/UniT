<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/components/prism-python.min.js"></script>

   <link rel="stylesheet" href="/static/css/edit-style.css">
<script defer src="/static/js/theme.js"></script>


</head>

<body>

    <header >
        <a style="height: 100%; align-content: center;" class="hideonmobile" href="/"><img style="margin-left: 1vw; height: 55%;" src="/static/pageicons/favicon.png"></a>

        <div id="title" class="title">Create new</div>
        <input type="text" style="margin: 1vw; width: 35%;" placeholder="filename" id="filename" autocomplete="off">
        <input type="text" style="margin: 1vw; width: 25%;" placeholder="commit name" id="commit" autocomplete="off">

        <button id="submit2" style="margin: 1vw; width: 20vw;" onclick="submit()" >Submit</button>
       
    </header>

    <div class="wrapper">

        <div class="editor" id="container">
            <div id="editor"></div>
        </div>
        <div class="preview" id="preview">
            
        </div>
        <div id="sidebar">
            <input type="text" id="search" style="margin: 1vw;" placeholder="Search" autocomplete="off">
            <input type="text" id="replace" style="margin: 1vw;" placeholder="Replace" autocomplete="off">
            <button id="replaceAll" style="margin: 1vw;">Replace all</button>
            <button id="replaceOne" style="margin: 1vw;">Replace</button>
            <button id="submit" style="margin: 1vw;" onclick="submit()" >Submit</button>
            
        </div>

    </div>

  <script defer src="/static/js/edit-script.js"></script>
</body>
